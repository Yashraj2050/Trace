<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" fill="none" role="img" aria-label="Trace — Light Theme Horizontal Logo">
  <defs>
    <linearGradient id="leafGradHL" x1="86" y1="26" x2="66" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6BAF7A"/>
      <stop offset="100%" stop-color="#1E4025"/>
    </linearGradient>
  </defs>

  <!-- ── T Mark ─────────────────────────────────────────────────────────── -->
  <!-- Crossbar -->
  <rect x="8"  y="8"  width="94" height="12" rx="1.5" fill="#0A0A0A"/>
  <!-- Stem -->
  <rect x="47" y="8"  width="16" height="100" rx="1" fill="#0A0A0A"/>
  <!-- Leaf (same gradient, slightly deeper for light bg) -->
  <path
    d="M 55 40 C 66 30,86 38,80 60 C 74 82,58 104,55 106
       C 55 106,48 92,50 76 C 52 60,44 44,55 40 Z"
    fill="url(#leafGradHL)"
  />
  <!-- Leaf vein -->
  <path d="M 55 106 C 57 88,62 64,76 38"
    stroke="#0E2A14" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────────── -->
  <text
    x="128" y="76"
    font-family="'Geist', 'Inter', system-ui, sans-serif"
    font-size="52"
    font-weight="600"
    letter-spacing="10"
    fill="#0A0A0A"
  >TRACE</text>

  <!-- ── Tagline ───────────────────────────────────────────────────────── -->
  <text
    x="131" y="98"
    font-family="'Geist', 'Inter', system-ui, sans-serif"
    font-size="9"
    font-weight="300"
    letter-spacing="4"
    fill="#4A8C5A"
    opacity="0.85"
  >KNOW YOUR IMPACT.</text>
</svg>
