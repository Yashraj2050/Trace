<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none" role="img" aria-label="Trace Logo Mark">
  <defs>
    <!-- Leaf gradient: sage green tip → deep forest green base -->
    <linearGradient id="leafGrad" x1="72" y1="46" x2="46" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8EC99A"/>
      <stop offset="100%" stop-color="#2A5C32"/>
    </linearGradient>
  </defs>

  <!-- ── T Crossbar ──────────────────────────────────────────────────────── -->
  <!-- Full-width horizontal bar with clean right-angle ends -->
  <rect x="4" y="8" width="112" height="14" rx="1.5" fill="white"/>

  <!-- ── T Stem ───────────────────────────────────────────────────────────── -->
  <!-- Centered vertical stem, overlaid by the leaf -->
  <rect x="51" y="8" width="18" height="112" rx="1" fill="white"/>

  <!-- ── Leaf ───────────────────────────────────────────────────────────── -->
  <!--
    Leaf sits in the lower half of the stem.
    Base is at the stem's bottom (y≈120), tip curves upper-right.
    Drawn as two bezier curves meeting at tip and base.
  -->
  <path
    d="
      M 60 54
      C 72 42, 94 52, 88 76
      C 82 100, 64 118, 60 120
      C 60 120, 52 108, 54 90
      C 56 72, 48 58, 60 54
      Z
    "
    fill="url(#leafGrad)"
  />

  <!-- Leaf center vein -->
  <path
    d="M 60 120 C 62 100, 66 74, 80 54"
    stroke="#1B3D20"
    stroke-width="1"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />
</svg>
